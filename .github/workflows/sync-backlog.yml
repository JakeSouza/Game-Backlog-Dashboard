# .github/workflows/deploy.yml
# Deploys the static site to GitHub Pages whenever you push to main.
# This does NOT sync data — the "Sync now" button on the page calls a
# Supabase Edge Function for that. No schedule, no secrets, no PAT.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }   # no cache: npm — that option requires a lockfile
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_RAWG_API_KEY: ${{ vars.VITE_RAWG_API_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4